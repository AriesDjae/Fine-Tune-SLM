# Gerbang anti-hanyut untuk ARENA PENILAIAN DOKTER.
#
# Dulu workflow ini juga membangun image worker RunPod Serverless
# (ghcr.io/ariesdjae/p6-arena) dari `webapp/runpod`. Jalur RunPod dipensiunkan karena
# biayanya, arena sekarang satu Space Docker yang dibangun HuggingFace sendiri dari
# `hf_space_arena/`, dan berkas lamanya ada di `arsip/pivot6_jalur-lama/`. Yang tersisa
# di sini cuma gerbangnya, yang tetap berguna: ia yang menahan roster dan prompt supaya
# tidak menyimpang antara sumber kebenaran dan salinan yang ikut ter-deploy.
#
# Saudaranya, docker.yml, tetap membangun image TRAINING dan tidak tersentuh.
name: gerbang-arena

on:
  push:
    paths:
      - arena/config.py
      - chat_format.py
      - hf_space_arena/**
      - scripts/uji_konsistensi.py
      - .github/workflows/docker-arena.yml
  pull_request:
    paths:
      - arena/config.py
      - chat_format.py
      - hf_space_arena/**
      - scripts/uji_konsistensi.py
      - .github/workflows/docker-arena.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gerbang-arena
  cancel-in-progress: true

jobs:
  gerbang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `python` (tanpa 3) TIDAK dijamin ada di runner ubuntu-24.04 — Ubuntu tidak lagi
      # memasang symlink python->python3 secara bawaan.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # arena/config.py adalah satu-satunya sumber kebenaran, dan salinannya di
      # hf_space_arena/app.py mudah menyimpang diam-diam. Men-deploy Space dari roster
      # yang sudah bergeser berarti dokter menilai sistem yang berbeda dari yang
      # dilaporkan di naskah.
      - name: Gerbang konsistensi
        run: python scripts/uji_konsistensi.py
